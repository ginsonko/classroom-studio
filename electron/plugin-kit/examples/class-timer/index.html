<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>课堂计时器</title>
<link rel="stylesheet" href="/__cs/ui.css">
<style>
  .time { font: 800 64px/1 "JetBrains Mono", "Cascadia Mono", monospace; text-align: center; letter-spacing: .02em; padding: 10px 0 4px; }
  .time.over { color: var(--cs-danger); }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .presets button { padding: 6px 0; }
  .mode { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .mode button.on { border-color: var(--cs-accent); color: var(--cs-accent); }
  .main { display: grid; grid-template-columns: 2fr 1fr; gap: 6px; }
</style>
</head>
<body>
<div class="cs-wrap">
  <div class="mode"><button id="down" class="on">倒计时</button><button id="up">正计时</button></div>
  <div id="time" class="time">05:00</div>
  <div class="presets" id="presets"></div>
  <div class="cs-row"><span class="cs-muted">自定义</span><input id="min" type="number" min="1" max="180" value="5" style="width:70px"><span class="cs-muted">分钟</span><span class="cs-grow"></span><button id="set">设定</button></div>
  <div class="main"><button id="go" class="cs-primary">开始</button><button id="reset">重置</button></div>
  <button id="show">在学生画面显示大号计时</button>
  <p class="cs-muted" id="tip">投到学生画面后，时间到了学生那边会响一声提示音。</p>
</div>
<script>
  // 状态存在插件数据里：学生画面上的大号计时页每隔一会儿读一次，两边显示一致
  var state = { mode: 'down', total: 300, start: 0, acc: 0, running: false };
  var $ = function (id) { return document.getElementById(id); };
  function elapsed() { return state.acc + (state.running ? (Date.now() - state.start) / 1000 : 0); }
  function fmt(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function save() { cs.storage.set('state', state); }
  var rang = false;
  function beep() { try { var a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .6); } catch (e) {} }
  function draw() {
    var e = elapsed(), left = state.total - e, over = state.mode === 'down' && left <= 0;
    $('time').textContent = state.mode === 'down' ? fmt(left) : fmt(e);
    $('time').classList.toggle('over', over);
    $('go').textContent = state.running ? '暂停' : (e > 0 ? '继续' : '开始');
    $('down').classList.toggle('on', state.mode === 'down'); $('up').classList.toggle('on', state.mode === 'up');
    if (over && state.running && !rang) { rang = true; beep(); }
  }
  [1, 3, 5, 10].forEach(function (m) {
    var b = document.createElement('button'); b.textContent = m + ' 分钟';
    b.onclick = function () { state.total = m * 60; state.acc = 0; state.running = false; rang = false; save(); draw(); };
    $('presets').appendChild(b);
  });
  $('set').onclick = function () { var m = Math.max(1, Math.min(180, Number($('min').value) || 5)); state.total = m * 60; state.acc = 0; state.running = false; rang = false; save(); draw(); };
  $('go').onclick = function () { if (state.running) { state.acc = elapsed(); state.running = false; } else { state.start = Date.now(); state.running = true; } save(); draw(); };
  $('reset').onclick = function () { state.acc = 0; state.running = false; rang = false; save(); draw(); };
  $('down').onclick = function () { state.mode = 'down'; save(); draw(); };
  $('up').onclick = function () { state.mode = 'up'; save(); draw(); };
  $('show').onclick = function () { cs.present.open('screen.html', { title: '课堂计时' }).catch(function (e) { $('tip').textContent = e.message; }); };
  cs.storage.get('state').then(function (s) { if (s && typeof s === 'object') state = Object.assign(state, s); draw(); });
  setInterval(draw, 250);
</script>
</body>
</html>
