<!doctype html><html><head><meta charset="UTF-8"><title>截屏</title><style>
html,body{margin:0;height:100%;overflow:hidden;cursor:crosshair;user-select:none;background:#000;font-family:"Microsoft YaHei UI","PingFang SC",sans-serif}
#shot{position:fixed;inset:0;width:100%;height:100%;display:block}
#dim{position:fixed;inset:0;background:rgba(0,0,0,.38)}
#box{position:fixed;display:none;outline:2px solid #3dd9eb;box-shadow:0 0 0 99999px rgba(0,0,0,.38);background:transparent}
#size{position:absolute;left:0;top:-26px;padding:2px 8px;border-radius:4px;background:#3dd9eb;color:#04140d;font:600 12px/18px monospace;white-space:nowrap}
#tip{position:fixed;left:50%;top:28px;transform:translateX(-50%);padding:10px 18px;border-radius:10px;background:rgba(16,18,23,.92);color:#fff;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.4);pointer-events:none}
#tip b{color:#3dd9eb}
</style></head><body><img id="shot" alt=""><div id="dim"></div><div id="box"><span id="size"></span></div><div id="tip">按住鼠标<b>框选</b>要贴到黑板的区域 · 右键或 Esc 取消</div><script src="snip.js"></script></body></html>
