<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高一物理（必修一）12 大力学经典模型速查工作台</title>
<link rel="stylesheet" href="../../vendor/katex.min.css">
<style>
  :root {
    --bg: #f3f7fa;
    --surface: #ffffff;
    --ink: #0f1f2e;
    --ink-2: #364b5e;
    --muted: #64788b;
    --line: #dbe5ee;
    --accent: #0f6d7a;
    --accent-soft: #e3f4f6;
    --warm: #c96428;
    --warm-soft: #fdf0e7;
    --ok: #1f7a4c;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    line-height: 1.55;
    overflow-x: hidden;
  }
  .wrap {
    max-width: 1220px;
    margin: 0 auto;
    padding: 20px 20px 44px;
  }
  /* 顶部检索横幅 */
  .top-hero {
    background: linear-gradient(125deg, #0d2b3e 0%, #115363 62%, #19747e 100%);
    color: #f8fafc;
    border-radius: 20px;
    padding: 22px 24px 18px;
    box-shadow: 0 12px 28px rgba(13, 43, 62, 0.14);
    margin-bottom: 16px;
  }
  .hero-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .hero-title h1 {
    margin: 0 0 4px;
    font-size: 24px;
    letter-spacing: 0.01em;
  }
  .hero-title p {
    margin: 0;
    font-size: 13.5px;
    color: #cbe7ee;
  }
  .hero-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .btn-mode {
    border: 1px solid rgba(255,255,255,0.28);
    background: rgba(255,255,255,0.12);
    color: #fff;
    padding: 7px 14px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-mode:hover { background: rgba(255,255,255,0.2); }
  .btn-mode.active {
    background: #fbbf24;
    color: #0f172a;
    border-color: #fbbf24;
  }
  .toolbar {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-box {
    flex: 1 1 240px;
    position: relative;
    min-width: 0;
  }
  .search-box input {
    width: 100%;
    height: 38px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.24);
    background: rgba(255,255,255,0.95);
    color: #0f172a;
    padding: 0 34px 0 12px;
    font-size: 13.5px;
    outline: none;
  }
  .search-clear {
    position: absolute;
    right: 6px;
    top: 5px;
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: #64748b;
    font-size: 16px;
    cursor: pointer;
    border-radius: 6px;
  }
  .cat-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .cat-btn {
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(15, 23, 42, 0.26);
    color: #e2e8f0;
    padding: 6px 12px;
    border-radius: 99px;
    font-size: 12.5px;
    cursor: pointer;
    font-weight: 600;
  }
  .cat-btn.on {
    background: #ffffff;
    color: #0d3b4c;
    border-color: #ffffff;
  }

  /* 交互速算条（针对核心主题：超重与失重电梯台秤） */
  .calc-strip {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    box-shadow: 0 4px 12px rgba(15, 31, 46, 0.04);
  }
  .calc-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--accent);
  }
  .calc-title span {
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--accent-soft);
    font-size: 11.5px;
  }
  .calc-sliders {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    flex: 1 1 320px;
  }
  .calc-sliders label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-2);
    min-width: 0;
  }
  .calc-sliders input[type="range"] {
    width: 108px;
    max-width: 42vw;
    accent-color: var(--accent);
  }
  .calc-out {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13px;
    background: #f8fafc;
    padding: 6px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
  }
  .state-pill {
    padding: 2px 9px;
    border-radius: 99px;
    font-weight: 700;
    font-size: 12px;
  }
  .state-pill.over { background: #fde8d7; color: #b54d13; }
  .state-pill.under { background: #dff3f6; color: #0b6472; }
  .state-pill.zero { background: #ede9fe; color: #6d28d9; }
  .state-pill.bal { background: #e2e8f0; color: #334155; }

  /* 统计信息行 */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 10px;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* 模型卡片网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 356px), 1fr));
    gap: 14px;
  }
  .m-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 15px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 4px 14px rgba(15, 31, 46, 0.04);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .m-card.featured {
    border-color: #67b7c2;
    box-shadow: 0 8px 22px rgba(15, 109, 122, 0.1);
  }
  .m-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .m-cat {
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .m-stars {
    font-size: 12px;
    color: #d97706;
    font-weight: 700;
    white-space: nowrap;
  }
  .m-title {
    margin: 4px 0 0;
    font-size: 16.5px;
    line-height: 1.3;
    color: var(--ink);
  }
  .m-body {
    display: grid;
    grid-template-columns: 112px 1fr;
    gap: 12px;
    align-items: center;
  }
  .m-svg {
    width: 112px;
    height: 88px;
    background: #f8fbfd;
    border: 1px solid #e3edf4;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .m-svg svg { width: 108px; height: 84px; display: block; }
  .m-formula {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 8px 10px;
    min-height: 54px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow-x: auto;
    position: relative;
  }
  body. cloaked .m-formula .tex-box,
  body.cloaked .m-formula .tex-box {
    filter: blur(6px);
    user-select: none;
    transition: filter 0.18s;
  }
  body.cloaked .m-card.revealed .m-formula .tex-box {
    filter: none;
  }
  .cloak-tip {
    display: none;
    font-size: 11px;
    color: var(--warm);
    margin-top: 3px;
  }
  body.cloaked .cloak-tip { display: block; }
  body.cloaked .m-card.revealed .cloak-tip { display: none; }

  .m-points {
    font-size: 12.5px;
    color: var(--ink-2);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .m-points .tip {
    background: #f0f9fa;
    border-left: 3px solid var(--accent);
    padding: 4px 8px;
    border-radius: 0 6px 6px 0;
  }
  .m-points .pit {
    background: var(--warm-soft);
    border-left: 3px solid var(--warm);
    padding: 4px 8px;
    border-radius: 0 6px 6px 0;
    color: #7c3711;
  }
  .m-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: auto;
    padding-top: 4px;
  }
  .m-tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }
  .m-tags span {
    font-size: 11px;
    color: var(--muted);
    background: #f1f5f9;
    padding: 1px 7px;
    border-radius: 99px;
  }
  .btn-detail {
    border: 1px solid #bcd8de;
    background: #f4fbfc;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-detail:hover { background: #e3f4f6; }
  .m-detail {
    display: none;
    border-top: 1px dashed var(--line);
    padding-top: 9px;
    font-size: 12.5px;
    color: var(--ink-2);
    background: #fafcfe;
    border-radius: 0 0 10px 10px;
  }
  .m-card.open .m-detail { display: block; }
  .m-detail b { color: var(--ink); }

  .empty {
    grid-column: 1 / -1;
    background: #fff;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 36px 20px;
    text-align: center;
    color: var(--muted);
  }

  @media (max-width: 520px) {
    .wrap { padding: 12px 12px 32px; }
    .top-hero { padding: 16px 14px; border-radius: 15px; }
    .hero-title h1 { font-size: 19px; }
    .m-body { grid-template-columns: 96px 1fr; gap: 9px; }
    .m-svg { width: 96px; height: 80px; }
    .m-svg svg { width: 92px; height: 76px; }
    .calc-sliders label { width: 100%; justify-content: space-between; }
    .calc-sliders input[type="range"] { flex: 1; max-width: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top-hero">
    <div class="hero-row">
      <div class="hero-title">
        <h1>高一力学 12 大经典模型互动速查手册</h1>
        <p>人教版必修第一册 · 核心方程 + 受力图解 + 秒杀口诀 + 母题拆解（单文件离线可用，默认取 g = 10 m/s²）</p>
      </div>
      <div class="hero-actions">
        <button type="button" class="btn-mode" id="btn-cloak">遮住公式自测</button>
        <button type="button" class="btn-mode" id="btn-expand-all">全部展开母题</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="search-box">
        <input type="search" id="q-input" placeholder="搜模型、关键词或易错点：如 电梯、传感器、下蹲、突变、传送带、等时圆…" aria-label="搜索力学模型">
        <button type="button" class="search-clear" id="q-clear" title="清空搜索">×</button>
      </div>
      <div class="cat-bar" id="cat-bar"></div>
    </div>
  </header>

  <!-- 实时速算器：紧扣超重与失重主题 -->
  <section class="calc-strip" aria-label="超重与失重实时速算器">
    <div class="calc-title"><span>高频母模型速算</span>电梯台秤视重核验器</div>
    <div class="calc-sliders">
      <label>质量 m：<input type="range" id="c-m" min="30" max="90" step="5" value="50"><b id="c-m-val">50 kg</b></label>
      <label>向上加速度 a：<input type="range" id="c-a" min="-10" max="6" step="0.5" value="2"><b id="c-a-val">+2.0 m/s²</b></label>
    </div>
    <div class="calc-out">
      <span id="c-fn"></span>
      <span>秤面标定：<b id="c-kg">60.0 kg</b></span>
      <span class="state-pill over" id="c-pill">超重</span>
    </div>
  </section>

  <div class="status-bar">
    <span id="hit-stat">当前显示全部 12 个必考模型</span>
    <span>提示：点击卡片「母题秒解」可展开典型例题；开启「遮住公式自测」可点卡片逐张翻开核对</span>
  </div>

  <main class="grid" id="model-grid"></main>
</div>

<script src="../../vendor/katex.min.js"></script>
<script>
(function () {
  'use strict';

  function texHtml(latex, display) {
    if (window.katex && typeof window.katex.renderToString === 'function') {
      return window.katex.renderToString(latex, { throwOnError: false, displayMode: !!display, strict: 'ignore' });
    }
    return latex;
  }

  var CATEGORIES = ['全部', '超重与失重', '斜面与摩擦', '连接体与滑轮', '弹簧与突变', '传送带与板块'];

  var MODELS = [
    {
      id: 'm01', cat: '超重与失重', stars: '★★★★★ 必考', featured: true,
      title: '01 · 电梯弹簧秤模型（超失重母模型）',
      tex: 'F_N = m(g + a),\\quad m_{\\text{示}} = \\frac{F_N}{g}',
      tip: '定竖直向上为正：加速上升、减速下降均有 a > 0（超重）；加速下降、减速上升均有 a < 0（失重）。',
      pit: '切忌凭速度方向猜状态！完全失重（a = -g）时支持力归零，但实重 mg 丝毫不变。',
      tags: ['电梯', '视重', '减速下降'],
      svg: '<svg viewBox="0 0 110 84"><rect x="22" y="6" width="66" height="72" rx="7" fill="#eef7f8" stroke="#0f6d7a" stroke-width="2"/><line x1="55" y1="0" x2="55" y2="6" stroke="#64788b" stroke-width="2"/><rect x="36" y="62" width="38" height="9" rx="3" fill="#0f6d7a"/><circle cx="55" cy="30" r="8" fill="#c96428"/><line x1="55" y1="38" x2="55" y2="54" stroke="#0f6d7a" stroke-width="4" stroke-linecap="round"/><line x1="55" y1="54" x2="47" y2="62" stroke="#0f6d7a" stroke-width="3"/><line x1="55" y1="54" x2="63" y2="62" stroke="#0f6d7a" stroke-width="3"/><path d="M96 58V22M91 28L96 21L101 28" stroke="#c96428" stroke-width="2.5" fill="none"/><text x="97" y="70" font-size="10" text-anchor="middle" fill="#c96428" font-weight="bold">a↑</text></svg>',
      example: '<b>母题：</b>质量 60 kg 乘客随电梯以 2 m/s² <b>减速下降</b>，求台秤读数。<br><b>秒解：</b>减速下降加速度向上 a = +2 m/s²，支持力 F<sub>N</sub> = 60×(10+2) = 720 N，秤面显示 72 kg（超重）。'
    },
    {
      id: 'm02', cat: '超重与失重', stars: '★★★★★ 高频', featured: true,
      title: '02 · 下蹲与起立力传感器 F–t 双峰模型',
      tex: '\\text{下蹲：先}\\,F_N\\lt mg\\,\\text{后}\\,F_N\\gt mg\\;\\;\\text{起立：先超后失}',
      tip: '先在 F–t 图上画 F = mg 水平基准线：一次完整下蹲必含「向下加速（失重谷）→ 向下减速刹停（超重峰）」两段。',
      pit: '波谷最低点只是向下加速度最大处，不是速度最大处！再次回到 F = mg 交点时速度才达最大。',
      tags: ['传感器', '下蹲起立', 'F-t图像'],
      svg: '<svg viewBox="0 0 110 84"><line x1="10" y1="42" x2="102" y2="42" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.5"/><line x1="12" y1="10" x2="12" y2="76" stroke="#334155" stroke-width="1.6"/><path d="M12 42 H24 Q34 74 44 42 Q54 10 66 42 H74 Q82 12 89 42 Q95 66 102 42" fill="none" stroke="#0f6d7a" stroke-width="2.4"/><text x="34" y="77" font-size="9" text-anchor="middle" fill="#0f6d7a">失</text><text x="55" y="16" font-size="9" text-anchor="middle" fill="#c96428">超</text><text x="20" y="37" font-size="8.5" fill="#64788b">mg</text></svg>',
      example: '<b>母题：</b>传感器图像先出现低于 mg 的波谷、紧接高于 mg 的波峰，判断动作。<br><b>秒解：</b>先失重（a 向下）后超重（a 向上制动），对应一次<b>完整下蹲</b>；若先峰后谷则为<b>站起</b>。'
    },
    {
      id: 'm03', cat: '超重与失重', stars: '★★★★☆ 拔高', featured: true,
      title: '03 · 系统牛顿第二定律（整体超失重法）',
      tex: 'F_N = (M + m)g + m a_y,\\quad f_{\\text{地}} = m a_x',
      tip: '斜面 M 静止于粗糙台秤上，滑块 m 以加速度 a 沿斜面加速下滑（a_y = -a sinθ < 0），系统整体失重，台秤示数小于 (M+m)g！',
      pit: '不用拆出滑块对斜面的正压力与摩擦力硬算投影，直接把加速度分解到水平和竖直即可一行出结果。',
      tags: ['整体法', '斜面台秤', '系统失重'],
      svg: '<svg viewBox="0 0 110 84"><rect x="14" y="66" width="82" height="8" rx="2" fill="#0f6d7a"/><polygon points="22,66 84,66 22,26" fill="#dceef2" stroke="#0f6d7a" stroke-width="1.8"/><rect x="42" y="34" width="16" height="12" transform="rotate(33 50 40)" fill="#c96428" rx="2"/><path d="M58 40 L75 51" stroke="#be123c" stroke-width="2.2"/><text x="78" y="48" font-size="9.5" fill="#be123c" font-weight="bold">a↘</text></svg>',
      example: '<b>母题：</b>质量 M 斜面静止在台秤上，质量 m 物块以加速度 a 沿倾角 θ 斜面加速下滑，求台秤读数。<br><b>秒解：</b>竖直分量向下 a<sub>y</sub> = -a sinθ，故 F<sub>N</sub> = (M+m)g - ma sinθ；地面静摩擦力水平向左，大小 ma cosθ。'
    },
    {
      id: 'm04', cat: '斜面与摩擦', stars: '★★★★★ 必考',
      title: '04 · 斜面自锁与匀速下滑临界角模型',
      tex: 'mg\\sin\\theta = \\mu mg\\cos\\theta \\;\\Longleftrightarrow\\; \\mu = \\tan\\theta',
      tip: '倾角恰满足 tanθ = μ 时，物块在斜面上匀速下滑（与物块质量 m 无关，叠放砝码后依然匀速！）。',
      pit: '若物块静止在斜面上（θ < arctan μ），摩擦力是静摩擦力 f = mg sinθ，绝不能套用 μmg cosθ！',
      tags: ['摩擦角', '静摩擦', '斜面平衡'],
      svg: '<svg viewBox="0 0 110 84"><polygon points="14,68 96,68 96,22" fill="#eef5f9" stroke="#364b5e" stroke-width="1.8"/><rect x="48" y="35" width="18" height="13" transform="rotate(-29 57 41)" fill="#0f6d7a" rx="2"/><text x="33" y="64" font-size="10" fill="#364b5e">θ</text><text x="58" y="25" font-size="9.5" fill="#0f6d7a" font-weight="bold">μ=tanθ</text></svg>',
      example: '<b>母题：</b>木块沿倾角 θ 斜面恰能匀速下滑；若在木块上再轻放一铁块，整体如何运动？<br><b>秒解：</b>合外力 (m+m₀)g(sinθ - μcosθ) = 0，质量约掉，整体<b>仍保持匀速下滑</b>。'
    },
    {
      id: 'm05', cat: '斜面与摩擦', stars: '★★★★☆ 高频',
      title: '05 · 斜向上拉物块的最小拉力极值模型',
      tex: 'F(\\alpha) = \\frac{\\mu mg}{\\cos\\alpha + \\mu\\sin\\alpha},\\quad F_{\\min} = \\frac{\\mu mg}{\\sqrt{1+\\mu^2}}',
      tip: '当拉力仰角 α 满足 tanα = μ（摩擦角）时，拉动水平面物块所需的拉力最小！斜向上拉既提供水平分力又减小正压力。',
      pit: '别漏掉拉力竖直分力 F sinα 对支持力 F_N = mg - F sinα 的减载效应。',
      tags: ['极值问题', '辅助角', '斜拉物块'],
      svg: '<svg viewBox="0 0 110 84"><line x1="10" y1="64" x2="100" y2="64" stroke="#364b5e" stroke-width="2"/><rect x="32" y="42" width="28" height="22" rx="3" fill="#dceef2" stroke="#0f6d7a" stroke-width="2"/><line x1="60" y1="50" x2="92" y2="28" stroke="#c96428" stroke-width="2.5"/><path d="M74 50 A16 16 0 0 0 71 42" fill="none" stroke="#64788b"/><text x="80" y="48" font-size="9.5" fill="#c96428" font-weight="bold">F↗α</text></svg>',

    {

      svg: '<svg viewBox="0 0 110 84"><circle cx="55" cy="42" r="32" fill="#f8fbfd" stroke="#0f6d7a" stroke-width="1.8"/><line x1="55" y1="10" x2="55" y2="74" stroke="#94a3b8" stroke-dasharray="3,2"/><line x1="55" y1="10" x2="27" y2="58" stroke="#c96428" stroke-width="2"/><line x1="55" y1="10" x2="84" y2="55" stroke="#0f6d7a" stroke-width="2"/><circle cx="55" cy="10" r="3" fill="#be123c"/></svg>',
      example: '<b>母题：</b>三根光滑细杆上端共点于竖直圆最高点、下端均落在圆周上，三环同时静止释放，谁先到底？<br><b>秒解：</b>标准等时圆，cosθ 在位移与加速度中恰好约消，<b>三环同时到达</b>。'
    },
    {
      id: 'm07', cat: '连接体与滑轮', stars: '★★★★★ 必考',
      title: '07 · 阿特伍德机（轻滑轮双物块连接体）',
      tex: 'a = \\frac{m_2 - m_1}{m_1 + m_2}g,\\quad T = \\frac{2m_1 m_2}{m_1 + m_2}g',
      tip: '两物块速率与加速度大小相等：重物加速下降失重（T < m₂g），轻物加速上升超重（T > m₁g），滑轮悬点拉力 2T < (m₁+m₂)g（整体失重）！',
      pit: '绝不能误以为绳拉力 T 等于 m₂g！只有 a = 0 时 T 才等于重力。',

      svg: '<svg viewBox="0 0 110 84"><line x1="55" y1="4" x2="55" y2="16" stroke="#334155" stroke-width="2"/><circle cx="55" cy="24" r="10" fill="#e2eff3" stroke="#0f6d7a" stroke-width="2"/><line x1="45" y1="24" x2="45" y2="58" stroke="#334155" stroke-width="1.8"/><line x1="65" y1="24" x2="65" y2="46" stroke="#334155" stroke-width="1.8"/><rect x="37" y="58" width="16" height="15" rx="2" fill="#0f6d7a"/><rect x="56" y="46" width="18" height="20" rx="2" fill="#c96428"/></svg>',
      example: '<b>母题：</b>定滑轮两侧挂 3 kg 与 1 kg 物块由静止释放，求天花板悬绳受到的拉力（g=10）。<br><b>秒解：</b>a = (3-1)/(3+1)g = 5 m/s²，单绳 T = 2×3×1/4 ×10 = 15 N，悬绳拉力 2T = <b>30 N</b>（小于总重 40 N，整体失重）。'

    {

      pit: '前提是两物块与接触面的 μ₁ = μ₂！一旦两物块粗糙程度不同，μ 项不能约消，必须老实先整体后隔离。',
      tags: ['整体隔离', '内力分配', '秒杀结论'],
      svg: '<svg viewBox="0 0 110 84"><line x1="8" y1="64" x2="102" y2="64" stroke="#334155" stroke-width="2"/><rect x="20" y="38" width="28" height="26" rx="3" fill="#0f6d7a"/><rect x="50" y="44" width="20" height="20" rx="3" fill="#5da6b0"/><line x1="6" y1="51" x2="20" y2="51" stroke="#c96428" stroke-width="2.8"/><text x="34" y="55" font-size="10" fill="#fff" text-anchor="middle">m₁</text><text x="60" y="58" font-size="9.5" fill="#fff" text-anchor="middle">m₂</text></svg>',
      example: '<b>母题：</b>粗糙斜面上用平行斜面向上的力 F = 30 N 拉 m₁ = 2 kg，后面连着同材质 m₂ = 1 kg，求中间细绳张力。<br><b>秒解：</b>同材质 μ 相同，远端质量 m₂ = 1 kg，张力 T = [1/(2+1)]×30 = <b>10 N</b>。'
    },
    {
      id: 'm09', cat: '弹簧与突变', stars: '★★★★★ 必考',
      title: '09 · 剪断轻绳 vs 剪断轻弹簧瞬时加速度模型',
      tex: 'T_{\\text{绳}} \\xrightarrow{\\text{瞬时}} 0,\\qquad F_{\\text{弹}} \\xrightarrow{\\text{瞬时}} \\text{保持原值}',
      tip: '轻绳、轻杆、接触面弹力形变极微小，剪断/撤去瞬间可立即突变；轻弹簧两端有质量物块阻挡，剪断瞬间长度来不及变，弹力保持剪断前一刻数值！',
      pit: '若弹簧被直接从中间剪断，则弹簧本身失效，弹力也会立即归零！',
      tags: ['瞬时加速度', '轻绳突变', '弹簧不变'],
      svg: '<svg viewBox="0 0 110 84"><line x1="30" y1="8" x2="80" y2="8" stroke="#334155" stroke-width="2"/><line x1="55" y1="8" x2="55" y2="26" stroke="#be123c" stroke-width="1.8" stroke-dasharray="3,2"/><circle cx="55" cy="33" r="8" fill="#0f6d7a"/><path d="M55 41 L49 45 L61 50 L49 55 L61 60 L55 64" fill="none" stroke="#c96428" stroke-width="2"/><circle cx="55" cy="71" r="8" fill="#5da6b0"/></svg>',
      example: '<b>母题：</b>天花板用细绳挂球 A（m），A 下用轻弹簧挂同质量球 B（m）。剪断细绳瞬间 A、B 加速度各多少？<br><b>秒解：</b>剪断前 F<sub>弹</sub> = mg。剪绳瞬间 F<sub>弹</sub> 仍为 mg，故 B 合力为 0（<b>a<sub>B</sub> = 0</b>），A 受向下 mg + F<sub>弹</sub> = 2mg（<b>a<sub>A</sub> = 2g 向下</b>）。'
    },
    {
      id: 'm10', cat: '弹簧与突变', stars: '★★★★☆ 压轴',
      title: '10 · 弹簧托物块匀加速上升「分离临界」模型',
      tex: '\\text{分离瞬间：}\\; F_{N,\\text{AB}} = 0 \\;\\text{且}\\; a_A = a_B = a,\\; F_{\\text{弹}} \\neq 0',
      tip: '拉力拉着木块离开压缩弹簧匀加速上升：刚分离时两物体间挤压弹力恰好降为 0，且此刻速度、加速度仍相等！',
      pit: '高频大坑：匀加速拉起时，物块与托盘分离位置<b>弹簧仍处于压缩态（F_弹 = m(g+a) > 0），绝不是弹簧原长</b>！',
      tags: ['分离临界', '弹簧压缩量', '匀加速'],
      svg: '<svg viewBox="0 0 110 84"><line x1="25" y1="76" x2="85" y2="76" stroke="#334155" stroke-width="2"/><path d="M55 76 L46 70 L64 63 L46 56 L64 49 L55 43" fill="none" stroke="#0f6d7a" stroke-width="2.2"/><rect x="37" y="36" width="36" height="7" rx="2" fill="#364b5e"/><rect x="42" y="20" width="26" height="15" rx="3" fill="#c96428"/><line x1="55" y1="20" x2="55" y2="6" stroke="#be123c" stroke-width="2.2"/></svg>',
      example: '<b>母题：</b>劲度系数 k 竖直弹簧上叠放质量均为 m 的 A、B，竖直向上拉 A 使之以 a 匀加速上升，求 A、B 分离时弹簧形变量。<br><b>秒解：</b>分离瞬间 N<sub>AB</sub> = 0，对下面 B 有 F<sub>弹</sub> - mg = ma ⇒ x = <b>m(g+a)/k</b>（仍压缩）。'
    },
    {
      id: 'm11', cat: '传送带与板块', stars: '★★★★★ 必考',
      title: '11 · 水平传送带加速共速与「划痕长度」模型',
      tex: 't_{\\text{共}} = \\frac{v}{\\mu g},\\quad x_{\\text{物}} = \\frac{v^2}{2\\mu g},\\quad \\Delta x_{\\text{划痕}} = x_{\\text{带}} - x_{\\text{物}} = \\frac{v^2}{2\\mu g}',
      tip: '静止轻放水平匀速传送带：共速前物块匀加速，传送带位移 x_带 = vt 是物块位移 x_物 = vt/2 的整整两倍，煤块划痕 Δx 恰好等于物块对地位移！',
      pit: '务必先算 x_物 与传送带总长 L 比大小，判断到底能不能在掉下传送带前达到共速！',
      tags: ['水平传送带', '划痕长度', '摩擦生热'],
      svg: '<svg viewBox="0 0 110 84"><rect x="14" y="42" width="82" height="20" rx="10" fill="#eef5f9" stroke="#364b5e" stroke-width="2"/><circle cx="24" cy="52" r="7" fill="#cbd5e1" stroke="#364b5e"/><circle cx="86" cy="52" r="7" fill="#cbd5e1" stroke="#364b5e"/><rect x="26" y="27" width="18" height="15" rx="2" fill="#334155"/><line x1="30" y1="41" x2="64" y2="41" stroke="#be123c" stroke-width="2.5"/><text x="72" y="36" font-size="9" fill="#0f6d7a" font-weight="bold">v→</text></svg>',
      example: '<b>母题：</b>煤块轻放在 v = 4 m/s 足够长水平传送带上，μ = 0.2，求煤块留下的黑色划痕长度（g=10）。<br><b>秒解：</b>a = μg = 2 m/s²，t = 2 s，x<sub>带</sub> = 8 m，x<sub>物</sub> = 4 m，划痕 Δx = 8 - 4 = <b>4 m</b>。'
    },
    {
      id: 'm12', cat: '传送带与板块', stars: '★★★★★ 压轴',
      title: '12 · 倾斜传送带顺逆转「两段加速度突变」模型',
      tex: 'a_1 = g(\\sin\\theta + \\mu\\cos\\theta) \\xrightarrow{v_{\\text{物}}=v_{\\text{带}}} \\begin{cases} v\\,\\text{匀速} & (\\mu\\ge\\tan\\theta)\\\\ g(\\sin\\theta-\\mu\\cos\\theta) & (\\mu\\lt\\tan\\theta)\\end{cases}',
      tip: '逆时针下传倾斜传送带顶端轻放物块：共速前皮带更快，滑动摩擦力沿斜面向下帮着拉（a₁ 大）；共速瞬间必须比较 μ 与 tanθ 判断能否拉住！',
      pit: '90% 错解在共速后忘了重新判断摩擦力方向，直接拿 a₁ 算到底！',
      tags: ['倾斜传送带', '摩擦突变', '分段运动'],
      svg: '<svg viewBox="0 0 110 84"><g transform="rotate(24 55 44)"><rect x="14" y="36" width="82" height="16" rx="8" fill="#e3f4f6" stroke="#0f6d7a" stroke-width="2"/><rect x="24" y="23" width="16" height="13" rx="2" fill="#c96428"/></g><text x="72" y="22" font-size="9.5" fill="#be123c" font-weight="bold">a₁ → a₂</text></svg>',
      example: '<b>母题：</b>倾角 37° 传送带以 10 m/s 逆时针转，μ = 0.5（< tan37° = 0.75），顶端轻放物块。<br><b>秒解：</b>第一段 a₁ = 10×(0.6+0.4) = 10 m/s²（历时 1s 走 5m 共速）；共速后滑不住，摩擦力翻转为沿斜面向上，第二段 a₂ = 10×(0.6-0.4) = <b>2 m/s²</b> 继续加速！'
    }
  ];

  var curCat = '全部';
  var curQuery = '';
  var openSet = { m01: true };
  var revealSet = {};
  var expandAll = false;

  var catBar = document.getElementById('cat-bar');
  var grid = document.getElementById('model-grid');
  var qInput = document.getElementById('q-input');
  var hitStat = document.getElementById('hit-stat');

  function renderCats() {
    catBar.innerHTML = '';
    CATEGORIES.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cat-btn' + (c === curCat ? ' on' : '');
      var cnt = c === '全部' ? MODELS.length : MODELS.filter(function (m) { return m.cat === c; }).length;
      b.textContent = c + ' (' + cnt + ')';
      b.addEventListener('click', function () {
        curCat = c;
        renderCats();
        renderGrid();
      });
      catBar.appendChild(b);
    });
  }

  function matches(m, q) {
    if (!q) return true;
    var hay = (m.title + ' ' + m.cat + ' ' + m.tip + ' ' + m.pit + ' ' + m.tags.join(' ') + ' ' + m.example).toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function renderGrid() {
    var q = curQuery.trim().toLowerCase();
    var list = MODELS.filter(function (m) {
      return (curCat === '全部' || m.cat === curCat) && matches(m, q);
    });
    hitStat.textContent = list.length === MODELS.length
      ? '当前显示全部 ' + list.length + ' 个必考模型'
      : '筛选命中 ' + list.length + ' / ' + MODELS.length + ' 个模型';

    if (!list.length) {
      grid.innerHTML = '<div class="empty">没有找到匹配的模型，试试搜「电梯」「传感器」「突变」或切回「全部」分类。</div>';
      return;
    }

    grid.innerHTML = '';
    list.forEach(function (m) {
      var isOpen = expandAll || !!openSet[m.id];
      var isRev = !!revealSet[m.id];
      var card = document.createElement('article');
      card.className = 'm-card' + (m.featured ? ' featured' : '') + (isOpen ? ' open' : '') + (isRev ? ' revealed' : '');
      card.innerHTML =
        '<div class="m-head">' +
          '<div><span class="m-cat">' + m.cat + '</span><h2 class="m-title">' + m.title + '</h2></div>' +
          '<span class="m-stars">' + m.stars + '</span>' +
        '</div>' +
        '<div class="m-body">' +
          '<div class="m-svg">' + m.svg + '</div>' +
          '<div class="m-formula" title="点击可翻开/遮住公式">' +
            '<div class="tex-box">' + texHtml(m.tex, false) + '</div>' +
            '<div class="cloak-tip">点击公式区揭晓核对</div>' +
          '</div>' +
        '</div>' +
        '<div class="m-points">' +
          '<div class="tip"><b>口诀：</b>' + m.tip + '</div>' +
          '<div class="pit"><b>防坑：</b>' + m.pit + '</div>' +
        '</div>' +
        '<div class="m-foot">' +
          '<div class="m-tags">' + m.tags.map(function (t) { return '<span>#' + t + '</span>'; }).join('') + '</div>' +
          '<button type="button" class="btn-detail">' + (isOpen ? '收起母题' : '母题秒解') + '</button>' +
        '</div>' +
        '<div class="m-detail">' + m.example + '</div>';

      card.querySelector('.m-formula').addEventListener('click', function () {
        revealSet[m.id] = !revealSet[m.id];
        card.classList.toggle('revealed', !!revealSet[m.id]);
      });
      card.querySelector('.btn-detail').addEventListener('click', function () {
        openSet[m.id] = !isOpen;
        if (expandAll && isOpen) expandAll = false;
        document.getElementById('btn-expand-all').classList.toggle('active', expandAll);
        renderGrid();
      });
      grid.appendChild(card);
    });
  }

  qInput.addEventListener('input', function () {
    curQuery = qInput.value;
    renderGrid();
  });
  document.getElementById('q-clear').addEventListener('click', function () {
    qInput.value = '';
    curQuery = '';
    renderGrid();
  });

  var btnCloak = document.getElementById('btn-cloak');
  btnCloak.addEventListener('click', function () {
    var on = document.body.classList.toggle('cloaked');
    revealSet = {};
    btnCloak.classList.toggle('active', on);
    btnCloak.textContent = on ? '显示全部公式' : '遮住公式自测';
    renderGrid();
  });

  var btnExpand = document.getElementById('btn-expand-all');
  btnExpand.addEventListener('click', function () {
    expandAll = !expandAll;
    btnExpand.classList.toggle('active', expandAll);
    btnExpand.textContent = expandAll ? '收起全部母题' : '全部展开母题';
    renderGrid();
  });

  // 实时速算器
  var cm = document.getElementById('c-m');
  var ca = document.getElementById('c-a');
  function updateCalc() {
    var m = Number(cm.value) || 50;
    var a = Number(ca.value) || 0;
    var fn = Math.max(0, m * (10 + a));
    document.getElementById('c-m-val').textContent = m + ' kg';
    document.getElementById('c-a-val').textContent = (a > 0 ? '+' : '') + a.toFixed(1) + ' m/s²';
    document.getElementById('c-fn').innerHTML = texHtml('F_N = ' + Math.round(fn) + '\\,\\mathrm{N}', false);
    document.getElementById('c-kg').textContent = (fn / 10).toFixed(1) + ' kg';
    var pill = document.getElementById('c-pill');
    if (fn <= 0.01) { pill.className = 'state-pill zero'; pill.textContent = '完全失重'; }
    else if (a > 0.01) { pill.className = 'state-pill over'; pill.textContent = '超重'; }
    else if (a < -0.01) { pill.className = 'state-pill under'; pill.textContent = '失重'; }
    else { pill.className = 'state-pill bal'; pill.textContent = '平衡态'; }
  }
  cm.addEventListener('input', updateCalc);
  ca.addEventListener('input', updateCalc);

  renderCats();
  updateCalc();
  renderGrid();

  // 供录制/轮播截图定格展示
  window.__showcasePose = function () {
    document.body.classList.remove('cloaked');
    curCat = '全部';
    curQuery = '';
    qInput.value = '';
    expandAll = false;
    openSet = { m01: true, m02: true };
    cm.value = '60';
    ca.value = '2.5';
    renderCats();
    updateCalc();
    renderGrid();
  };
})();
</script>
</body>
</html>
